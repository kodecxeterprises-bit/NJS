
name: NJS Billing Tests

on:
  workflow_dispatch:
  push:
    branches:
      - codex/supabase-auth-migration
    paths:
      - "cloudflare/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/billing-tests.yml"

permissions:
  contents: read

concurrency:
  group: njs-billing-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  billing-tests:
    name: Run NJS billing test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run test suite
        run: bun run test
