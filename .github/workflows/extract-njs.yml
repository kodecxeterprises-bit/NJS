
name: Extract NJS Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up extraction environment
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip rsync

      - name: Validate and extract NJS project
        run: |
          ZIP="NJS.zip"
          EXTRACT_DIR="/tmp/njs-extracted"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in the repository root."
            ls -la
            exit 1
          fi

          echo "Checking ZIP archive..."
          unzip -t "$ZIP"

          mkdir -p "$EXTRACT_DIR"

          echo "Extracting complete NJS project..."
          unzip -o -q "$ZIP" -d "$EXTRACT_DIR"

          PROJECT_DIR="$EXTRACT_DIR/NJS"

          if [ ! -d "$PROJECT_DIR" ]; then
            echo "ERROR: Expected NJS project folder was not found."
            find "$EXTRACT_DIR" -maxdepth 3 -type f | head -100
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "ERROR: package.json is missing from extracted project."
            exit 1
          fi

          echo "Project structure validated successfully."

          echo "Replacing repository files..."

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='node_modules/' \
            "$PROJECT_DIR/" ./

          rm "$ZIP"

          echo "NJS project extracted successfully."

          echo "Updated project files:"
          ls -la
          ls -la src/pages
          ls -la cloudflare

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update complete NJS project"
            git push origin HEAD:${{ github.ref_name }}
          fi
