      - name: Extract NJS messaging updates
        run: |
          ZIP="njs-messaging-updated-files.zip"

          if [ ! -f "$ZIP" ]; then
            echo "$ZIP was not found in the repository root."
            ls -la
            exit 1
          fi

          mkdir -p /tmp/njs-messaging
          unzip -o -q "$ZIP" -d /tmp/njs-messaging

          mkdir -p src/pages src/types

          cp /tmp/njs-messaging/njs-messaging-update/MessagesPage.tsx src/pages/MessagesPage.tsx
          cp /tmp/njs-messaging/njs-messaging-update/index.ts src/types/index.ts

          rm "$ZIP"

          echo "Messaging files extracted successfully."
          ls -l src/pages/MessagesPage.tsx src/types/index.ts