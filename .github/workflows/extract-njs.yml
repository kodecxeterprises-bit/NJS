
name: Extract NJS Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Extract NJS messaging updates
        run: |
          ZIP="njs-messaging-updated-files.zip"

          if [ ! -f "$ZIP" ]; then
            echo "$ZIP was not found in the repository root."
            ls -la
            exit 1
          fi

          mkdir -p /tmp/njs-messaging
          unzip -o -q "$ZIP" -d /tmp/njs-messaging

          mkdir -p src/pages src/types

          cp /tmp/njs-messaging/njs-messaging-update/MessagesPage.tsx src/pages/MessagesPage.tsx
          cp /tmp/njs-messaging/njs-messaging-update/index.ts src/types/index.ts

          rm "$ZIP"

          echo "Messaging files extracted successfully."
          ls -l src/pages/MessagesPage.tsx src/types/index.ts

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/pages/MessagesPage.tsx src/types/index.ts
          git add -u

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update NJS messaging features"
            git push origin HEAD:${{ github.ref_name }}
          fi
