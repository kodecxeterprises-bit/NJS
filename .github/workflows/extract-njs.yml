
name: Extract NJS Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip rsync

      - name: Extract and replace NJS project
        run: |
          set -e

          ZIP="NJS.zip"
          SAFE_ZIP="/tmp/NJS-backup.zip"
          EXTRACT_DIR="/tmp/njs-extracted"
          PROJECT_DIR="$EXTRACT_DIR/NJS"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: NJS.zip not found in repository root."
            ls -la
            exit 1
          fi

          echo "Backing up ZIP archive..."
          cp "$ZIP" "$SAFE_ZIP"

          echo "Validating archive..."
          unzip -t "$SAFE_ZIP"

          mkdir -p "$EXTRACT_DIR"

          echo "Extracting project..."
          unzip -o -q "$SAFE_ZIP" -d "$EXTRACT_DIR"

          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "ERROR: Extracted project is incomplete."
            find "$EXTRACT_DIR" -maxdepth 3 -type f
            exit 1
          fi

          echo "Project validated."

          echo "Replacing repository contents..."

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='node_modules/' \
            "$PROJECT_DIR/" ./

          echo "Removing original ZIP..."
          rm -f "$ZIP"

          echo "Extraction completed successfully!"

          echo "Checking important files..."
          test -f package.json
          test -f src/App.tsx
          test -f cloudflare/worker.ts
          test -f cloudflare/support-routes.ts

          echo "All required files are present."

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update complete NJS project"
            git push origin HEAD:${{ github.ref_name }}
          fi
