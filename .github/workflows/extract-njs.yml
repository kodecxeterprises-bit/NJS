
name: Extract NJS Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip rsync

      - name: Extract and replace NJS project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="NJS.zip"
          SAFE_ZIP="/tmp/NJS-backup.zip"
          EXTRACT_DIR="/tmp/njs-extracted"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: NJS.zip not found in repository root."
            exit 1
          fi

          echo "Backing up archive..."
          cp "$ZIP" "$SAFE_ZIP"

          echo "Checking ZIP integrity..."
          unzip -t "$SAFE_ZIP"

          mkdir -p "$EXTRACT_DIR"

          echo "Extracting NJS archive..."
          unzip -o -q "$SAFE_ZIP" -d "$EXTRACT_DIR"

          echo "Locating the actual NJS project..."

          mapfile -d '' -t PROJECTS < <(
            find "$EXTRACT_DIR" -type f -name "package.json" -print0 |
            while IFS= read -r -d '' PACKAGE; do
              DIR="$(dirname "$PACKAGE")"

              if [ -f "$DIR/src/App.tsx" ] &&
                 [ -f "$DIR/cloudflare/worker.ts" ] &&
                 [ -f "$DIR/cloudflare/support-routes.ts" ]; then
                printf '%s\0' "$DIR"
              fi
            done
          )

          if [ "${#PROJECTS[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one valid NJS project."
            echo "Found ${#PROJECTS[@]} candidate project folders:"
            printf '%s\n' "${PROJECTS[@]}"
            exit 1
          fi

          PROJECT_DIR="${PROJECTS[0]}"

          echo "Found NJS project: $PROJECT_DIR"

          echo "Validating project files..."

          test -f "$PROJECT_DIR/package.json"
          test -f "$PROJECT_DIR/src/App.tsx"
          test -f "$PROJECT_DIR/cloudflare/worker.ts"
          test -f "$PROJECT_DIR/cloudflare/support-routes.ts"

          echo "Replacing repository project files..."

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            "$PROJECT_DIR/" ./

          echo "Removing processed archive..."
          rm -f "$ZIP"

          echo "Verifying extracted repository..."

          test -f package.json
          test -f src/App.tsx
          test -f cloudflare/worker.ts
          test -f cloudflare/support-routes.ts

          echo "NJS extraction completed successfully."

      - name: Commit extracted project
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update complete NJS project"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
