name: Build and Deploy NJS to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - codex/supabase-auth-migration

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build production frontend
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify Cloudflare frontend and Worker entrypoints
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s cloudflare/worker.ts
          test -s cloudflare/app-routes.ts
          test -s cloudflare/billing-routes.ts
          test -s cloudflare/support-routes.ts
          if grep -q '/src/main.tsx' dist/index.html; then
            echo "ERROR: Production HTML references source code"
            exit 1
          fi
          echo "Cloudflare frontend and Worker entrypoints verified."

      - name: Deploy Cloudflare Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.156.0 deploy \
            --config wrangler.jsonc \
            --account-id "$CLOUDFLARE_ACCOUNT_ID"
